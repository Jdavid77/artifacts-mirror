apiVersion: mirror.fluxcd.io/v1alpha1
kind: Config
artifacts:
  - source: ghcr.io/grimmory-tools/grimmory
    destination: ghcr.io/jdavid77/grimmory
    selector:
      semver: ">= 3.0.0"
      limit: 5
    includeReferrers: true
  - source: ghcr.io/rendercv/rendercv
    destination: ghcr.io/jdavid77/rendercv
    selector:
      semver: ">= 2.0.0"
      limit: 5
    includeReferrers: true
  - source: ghcr.io/calibrain/shelfmark
    destination: ghcr.io/jdavid77/shelfmark
    selector:
      semver: ">= 1.0.0"
      limit: 5
    includeReferrers: true
