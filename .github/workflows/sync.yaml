name: Artifacts Mirror Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: artifacts-mirror-runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flux Mirror CLI
        uses: fluxcd/flux-mirror/actions/setup@main
        with:
          version: v0.7.0
      - name: Login to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync
        run: flux-mirror sync flux-mirror.yaml --no-progress --drift-exit-code=0
