name: Artifacts Mirror Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: artifacts-mirror-runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flux Mirror CLI
        uses: fluxcd/flux-mirror/actions/setup@5ac513aec160a794b40db9bdb6a98c34227196a8 # v0.17.0
        with:
          version: v0.17.0

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync
        run: flux-mirror sync flux-mirror.yaml --no-progress --drift-exit-code=0
